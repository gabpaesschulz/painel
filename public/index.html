<!doctype html>
<html lang="pt-BR" data-theme="noite" data-font="editorial" data-sky="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="google" content="notranslate">
<title>Painel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/atkinson-next-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div id="sky"></div>

<main class="app" id="app" data-side="left">

  <!-- AGORA: hora, dia, tempo -->
  <section class="side side-a" id="sideA">
    <header class="hero rise" style="--d:.05s">
      <div class="kicker" id="greet">Bom dia</div>
      <div class="time" id="time" aria-live="off">--:--</div>
      <div class="date" id="date"></div>
      <div class="holiday" id="todayHoliday" hidden></div>
    </header>

    <div class="rule"></div>
    <section class="now rise" id="wxNow" style="--d:.15s"></section>
    <div class="hint-slot rise" id="wxHint" style="--d:.22s"></div>

    <div class="rule" id="aheadRule"></div>
    <section class="ahead rise" id="wxAhead" style="--d:.3s"></section>
  </section>

  <!-- AGENDA, SEMANA E SEGURANÇA -->
  <section class="side side-b" id="sideB">
    <header class="bar rise" style="--d:.08s">
      <div class="kicker">Meus compromissos</div>
      <div class="bar-end">
        <div class="status" id="status" hidden></div>
        <div class="note" id="agendaNote"></div>
        <button id="gear" aria-label="Configurações (segure por 1 segundo)">
          <svg class="ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36"/></svg>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        </button>
      </div>
    </header>
    <nav class="week rise" id="week" style="--d:.14s" aria-label="Semana"></nav>
    <section class="panel agenda rise" id="agenda" style="--d:.2s"></section>
    <section class="panel safety rise" id="safety" style="--d:.28s"></section>
  </section>

</main>

<div id="rest" hidden>
  <div class="ri"><div class="ra" id="restAlert"></div><div class="rt"></div><div class="rd"></div><div class="rn"></div></div>
</div>

<div id="settings" hidden></div>

<script>
  // leitor de agenda (.ics): é um módulo ES, por isso o import()
  window.icalReady = import("./vendor/ical.min.js").then(m => { window.ICAL = m.default; }).catch(e => console.warn("ical:", e));
</script>
<script src="js/ui-icons.js"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/view-main.js"></script>
<script src="js/kiosk.js"></script>
<script src="js/settings.js"></script>
<script>
  document.querySelector("#gear svg.ic").innerHTML = (window.UI_ICONS || {}).settings || "";
</script>
<script src="js/main.js"></script>
</body>
</html>
