# Publica o painel no GitHub Pages e renova a cópia do nível do rio e dos avisos da Defesa Civil a cada 15 minutos.
# A cópia é a reserva: o painel lê a Defesa Civil ao vivo pelo servidor (Cloudflare) e usa esta quando ele falhar.
# Se o GitHub atrasar ou parar este agendamento, o painel percebe pelo status.json e avisa "sem atualizar".
name: Publicar painel

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Testes (nada vai para o tablet se falharem)
        env:
          TZ: America/Sao_Paulo
        run: |
          node tools/test-ics.js
          node tools/contrast.js
      - id: pages
        uses: actions/configure-pages@v5
      - name: Baixar nível do rio e avisos da Defesa Civil (AlertaBLU / Blumenau)
        run: python3 tools/fetch_data.py "${{ steps.pages.outputs.base_url }}"
      - name: Marcar a versão (o painel recarrega sozinho quando ela muda)
        run: echo "{\"build\":\"${GITHUB_SHA::7}\"}" > public/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
